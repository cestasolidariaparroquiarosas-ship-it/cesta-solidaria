# Copia de seguridad (spec §7, CA-34). DESACTIVADA en este repositorio público: se
# trasladará a un repositorio privado (docs/operacion.md, "Copias de seguridad").
# La consulta que evita que Supabase se pause está en mantener-activo.yml.
# Si falla, GitHub avisa por correo al último usuario que modificó el cron de este
# archivo: el responsable debe revisar Actions → backup de vez en cuando (docs/operacion.md).
name: backup

on:
  # Desactivada (v0.3.1): el repositorio es público y los artefactos de Actions de un
  # repositorio público los puede descargar cualquier usuario de GitHub. La copia va
  # cifrada, pero no se publica ni cifrada. Se trasladará a un repositorio privado
  # (docs/operacion.md, "Copias de seguridad"). Hasta entonces, solo a mano.
  # schedule:
  #   - cron: "17 3 * * *" # 03:17 UTC, de madrugada en España
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  copia:
    # No se ejecuta ni a mano mientras el repositorio sea público: subiría el artefacto.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Volcado de producción
        env:
          DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        run: |
          mkdir copia
          npx supabase db dump --remote="$DB_URL" -f copia/roles.sql --role-only
          npx supabase db dump --remote="$DB_URL" -f copia/esquema.sql
          npx supabase db dump --remote="$DB_URL" -f copia/datos.sql --use-copy --data-only

      - name: Cifrar
        env:
          FRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          fecha=$(date -u +%Y-%m-%d)
          tar -czf "copia-$fecha.tar.gz" copia
          gpg --batch --yes --pinentry-mode loopback --passphrase "$FRASE" \
              --symmetric --cipher-algo AES256 -o "copia-$fecha.tar.gz.gpg" "copia-$fecha.tar.gz"
          rm -rf copia "copia-$fecha.tar.gz"
          echo "FECHA=$fecha" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: copia-${{ env.FECHA }}
          path: copia-${{ env.FECHA }}.tar.gz.gpg
          retention-days: 30
